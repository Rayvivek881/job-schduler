# Nginx configuration for Job Scheduler API Server
# Place this file in /etc/nginx/sites-available/job-scheduler
# Then create symlink: sudo ln -s /etc/nginx/sites-available/job-scheduler /etc/nginx/sites-enabled/

upstream job_scheduler_api {
    server 127.0.0.1:8000;
    # Add more servers for load balancing:
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
}

# HTTP Server (redirect to HTTPS)
server {
    listen 80;
    server_name job-scheduler.example.com;  # Change to your domain

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name job-scheduler.example.com;  # Change to your domain

    # SSL Certificate configuration
    # Uncomment and configure based on your SSL setup:
    
    # Let's Encrypt (certbot)
    # ssl_certificate /etc/letsencrypt/live/job-scheduler.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/job-scheduler.example.com/privkey.pem;
    
    # Self-signed (development only)
    # ssl_certificate /etc/nginx/ssl/job-scheduler.crt;
    # ssl_certificate_key /etc/nginx/ssl/job-scheduler.key;

    # SSL Configuration (recommended settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/job-scheduler-access.log;
    error_log /var/log/nginx/job-scheduler-error.log;

    # Client body size limit (adjust as needed for large job payloads)
    client_max_body_size 10M;

    # Rate limiting (optional, if not using app-level rate limiting)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # limit_req zone=api_limit burst=20 nodelay;

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://job_scheduler_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Health checks are quick, use short timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # API endpoints
    location / {
        # Rate limiting (if enabled above)
        # limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://job_scheduler_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (adjust based on job execution time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # 5 minutes for long-running requests

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}
