apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-scheduler-scheduler
  labels:
    app: job-scheduler
    component: scheduler
spec:
  replicas: 1  # Singleton - only one scheduler instance
  selector:
    matchLabels:
      app: job-scheduler
      component: scheduler
  template:
    metadata:
      labels:
        app: job-scheduler
        component: scheduler
    spec:
      containers:
      - name: scheduler
        image: job-scheduler:latest
        imagePullPolicy: Always
        command: ["./job-scheduler", "scheduler", "first-time"]
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: APP_ENV
        - name: PG_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: PG_DB_HOST
        - name: PG_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: PG_DB_PORT
        - name: PG_DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: PG_DB_DATABASE
        - name: PG_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: PG_DB_USERNAME
        - name: PG_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: job-scheduler-secrets
              key: PG_DB_PASSWORD
        - name: PG_DB_DEBUG
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: PG_DB_DEBUG
        - name: PG_DB_SSL
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: PG_DB_SSL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: KAFKA_BROKERS
        - name: KAFKA_VERSION
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: KAFKA_VERSION
        - name: JOBS_TOPIC
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: JOBS_TOPIC
        - name: CONSUMER_GROUP
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: CONSUMER_GROUP
        - name: TICKER_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: TICKER_INTERVAL
        - name: JOB_EXECUTION_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: job-scheduler-config
              key: JOB_EXECUTION_TIMEOUT
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      restartPolicy: Always
