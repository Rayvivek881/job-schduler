apiVersion: v1
kind: Secret
metadata:
  name: job-scheduler-secrets
  labels:
    app: job-scheduler
type: Opaque
stringData:
  # API Key - CHANGE THIS IN PRODUCTION
  API_KEY: "your-production-api-key-change-me"
  
  # Database Password - CHANGE THIS IN PRODUCTION
  PG_DB_PASSWORD: "your-database-password"
  
  # Kafka Credentials (optional, leave empty if not using SASL)
  KAFKA_USERNAME: ""
  KAFKA_PASSWORD: ""
  KAFKA_SASL_MECHANISM: ""

---
# Instructions for creating secrets:
#
# Option 1: Edit this file and apply (NOT RECOMMENDED - secrets in Git)
# kubectl apply -f deploy/k8s/secrets.yaml
#
# Option 2: Create from literals (RECOMMENDED)
# kubectl create secret generic job-scheduler-secrets \
#   --from-literal=API_KEY='your-api-key' \
#   --from-literal=PG_DB_PASSWORD='your-password' \
#   --from-literal=KAFKA_USERNAME='kafka-user' \
#   --from-literal=KAFKA_PASSWORD='kafka-password' \
#   --from-literal=KAFKA_SASL_MECHANISM='SCRAM-SHA-256'
#
# Option 3: Create from .env file
# kubectl create secret generic job-scheduler-secrets \
#   --from-env-file=.env.production
